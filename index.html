<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdCIL Incident Dashboard</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f27;--mu:#6b7280;--bd:#e3e6ea;--pr:#2f5bd8;--hi:#d33f3f;--me:#d98a12;--na:#8b93a1;--ok:#1f9d6b;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b1f27;--tx:#e8eaee;--mu:#98a0ae;--bd:#2c323d;--pr:#7c9cff;--hi:#ff6b6b;--me:#f0a63a;--na:#7b8494;--ok:#3ecf94;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
h1{font-size:18px;margin:0}small,.mu{color:var(--mu)}main{padding:16px 20px;max-width:1400px;margin:auto}
button,select,input,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.p{background:var(--pr);border-color:var(--pr);color:#fff}button:hover{filter:brightness(.96)}
.st{display:inline-flex;gap:6px;align-items:center}.dot{width:9px;height:9px;border-radius:50%;background:var(--na)}.dot.ok{background:var(--ok)}.dot.bad{background:var(--hi)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}.kpi b{display:block;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:14px}
h2{font-size:13px;margin:0 0 10px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
.bar{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;margin:4px 0;font-size:12px}.bar i{display:block;height:10px;border-radius:5px;background:var(--pr)}
.bar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar span:last-child{text-align:right}
.cols{display:flex;align-items:flex-end;gap:6px;height:130px}.cols div{flex:1;text-align:center;font-size:10px;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.cols i{display:block;background:var(--pr);border-radius:4px 4px 0 0;min-height:2px}
.fl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.fl input{flex:1;min-width:180px}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:900px}th,td{padding:8px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--card);font-size:12px;color:var(--mu);cursor:pointer;white-space:nowrap}td.is{max-width:380px}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid currentColor}.HIGH{color:var(--hi)}.MEDIUM{color:var(--me)}.NA,.LOW{color:var(--na)}
td button{padding:3px 8px;font-size:12px}
dialog{border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);width:min(640px,94vw);padding:18px}dialog::backdrop{background:#0008}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}.f .w{grid-column:1/-1}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9}
@media(max-width:560px){.f{grid-template-columns:1fr}}
</style></head><body>

<p style="display:flex;gap:8px;justify-content:flex-end;margin:14px 0 0"><button onclick="dlg.close()">Cancel</button><button class="p" onclick="save()">Save</button></p></dialog>

    if(fn==='saveIncident'){const r=a[0];if(r.id){d=d.map(x=>x.id==r.id?r:x)}else{r.id=Math.max(0,...d.map(x=>+x.id))+1;d.push(r)}ls.set(d)}
    if(fn==='deleteIncident'){d=d.filter(x=>x.id!=a[0]);ls.set(d)}ok(d)});}
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)};
function status(ok,msg){$('#dot').className='dot '+(ok?'ok':'bad');$('#sync').textContent=msg}
async function load(){try{const r=await api('getIncidents');rows=Array.isArray(r)?r:r.rows;status(true,(CLOUD?'Synced ':'Demo mode (local) · ')+new Date().toLocaleTimeString());render()}catch(e){status(false,'Sync failed: '+(e.message||e))}}
async function write(fn,...a){
  try{const r=await api(fn,...a,pass);rows=Array.isArray(r)?r:r.rows;status(true,'Saved '+new Date().toLocaleTimeString());render();return true}
  catch(e){const m=String(e.message||e);if(/PASSCODE/.test(m)){const p=prompt('Edit passcode required:');if(p){pass=p;return write(fn,...a)}}else toast('Error: '+m);return false}}
const uniq=k=>[...new Set(rows.map(r=>r[k]).filter(Boolean))].sort();
function fill(id,label,vals){const s=$(id),v=s.value;s.innerHTML=`<option value="">${label}</option>`+vals.map(x=>`<option>${esc(x)}</option>`).join('');s.value=vals.includes(v)?v:''}
function filtered(){const q=$('#q').value.toLowerCase(),fr=$('#fr').value,fc=$('#fc').value,fi=$('#fi').value,fd=$('#fd').value;
  return rows.filter(r=>(!fr||r.region===fr)&&(!fc||r.category===fc)&&(!fi||r.impact===fi)&&(!fd||r.date===fd)&&(!q||[r.centre,r.city,r.state,r.issue,r.tcCode,r.remarks].join(' ').toLowerCase().includes(q)))}
function bars(el,m,total){const e=Object.entries(m).sort((a,b)=>b[1]-a[1]),mx=e[0]?e[0][1]:1;$(el).innerHTML=e.map(([k,v])=>`<div class="bar"><span title="${esc(k)}">${esc(k)}</span><span><i style="width:${v/mx*100}%"></i></span><span>${v}</span></div>`).join('')||'<span class="mu">No data</span>'}
const cnt=(a,f)=>a.reduce((m,r)=>{const k=f(r);if(k)m[k]=(m[k]||0)+1;return m},{});
function render(){
  fill('#fr','All regions',uniq('region'));fill('#fc','All categories',uniq('category'));fill('#fi','All impacts',uniq('impact'));fill('#fd','All dates',uniq('date'));
  $('#cats').innerHTML=uniq('category').map(c=>`<option value="${esc(c)}">`).join('');
  const f=filtered(),d=f.filter(r=>r.delay!==''&&r.delay!=null&&!isNaN(r.delay)),tot=d.reduce((s,r)=>s+ +r.delay,0),cats=cnt(f,r=>r.category),top=Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
  $('#kpis').innerHTML=[['Total incidents',f.length],['High impact',f.filter(r=>r.impact==='HIGH').length],['Medium impact',f.filter(r=>r.impact==='MEDIUM').length],['Centres affected',new Set(f.map(r=>r.tcCode)).size],['Total delay (min)',tot],['Avg delay (min)',d.length?(tot/d.length).toFixed(1):'–'],['Top category',top?top[0]+' ('+top[1]+')':'–']].map(([l,v])=>`<div class="card kpi"><small>${l}</small><b style="${l==='Top category'?'font-size:17px':''}">${esc(v)}</b></div>`).join('');
  bars('#cCat',cats);bars('#cReg',cnt(f,r=>r.region));bars('#cImp',cnt(f,r=>r.impact));
  const days=cnt(f,r=>r.date),dk=Object.keys(days).sort(),mx=Math.max(1,...Object.values(days));
  $('#cDay').innerHTML=dk.map(k=>`<div title="${k}: ${days[k]}"><span>${days[k]}</span><i style="height:${days[k]/mx*95}px"></i><span>${k.slice(8)}/${k.slice(5,7)}</span></div>`).join('');
  $('#th').innerHTML=COLS.map(([k,l])=>`<th onclick="srt('${k}')">${l}${sort.k===k?(sort.d>0?' ▲':' ▼'):''}</th>`).join('')+'<th></th>';
  const s=[...f].sort((a,b)=>{let x=a[sort.k],y=b[sort.k];if(['id','shift','delay'].includes(sort.k)){x=x===''?-1:+x;y=y===''?-1:+y}return (x>y?1:x<y?-1:0)*sort.d});
  $('#tb').innerHTML=s.map(r=>`<tr><td>${r.id}</td><td>${esc(r.date)}</td><td>${esc(r.shift)}</td><td>${esc(r.region)}</td><td><b>${esc(r.centre)}</b><br><small>${esc(r.city)}, ${esc(r.state)} · ${esc(r.tcCode)}</small></td><td class="is">${esc(r.issue)}</td><td>${esc(r.category)}</td><td>${r.delay===''||r.delay==null?'–':r.delay}</td><td><span class="tag ${esc(r.impact)}">${esc(r.impact)}</span></td><td style="white-space:nowrap"><button onclick="edit(${r.id})">Edit</button> <button onclick="del(${r.id})">Del</button></td></tr>`).join('');
  $('#cnt').textContent=`Showing ${f.length} of ${rows.length} incidents`}
function srt(k){sort=sort.k===k?{k,d:-sort.d}:{k,d:1};render()}
function resetF(){$('#q').value='';['#fr','#fc','#fi','#fd'].forEach(s=>$(s).value='');render()}
function edit(id){cur=id?rows.find(r=>r.id==id):null;$('#dt').textContent=cur?'Edit incident #'+id:'Add incident';
  FIELDS.forEach(k=>$('#e_'+k).value=cur?(cur[k]??''):(k==='shift'?'1':k==='impact'?'MEDIUM':k==='date'?new Date().toISOString().slice(0,10):''));$('#dlg').showModal()}
async function save(){const r={id:cur?cur.id:0};FIELDS.forEach(k=>r[k]=$('#e_'+k).value.trim());
  if(!r.centre||!r.issue||!r.date)return toast('Centre, date and issue are required');
  r.delay=r.delay===''?'':+r.delay;r.region=r.region.toUpperCase();r.state=r.state.toUpperCase();r.city=r.city.toUpperCase();
  if(await write('saveIncident',r)){$('#dlg').close();toast('Saved')}}
async function del(id){if(confirm('Delete incident #'+id+'?'))await write('deleteIncident',id)}
function csv(){const h=['id',...FIELDS],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const t=[h.join(','),...filtered().map(r=>h.map(k=>q(r[k])).join(','))].join('\n'),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download='ssc_incidents.csv';a.click()}
['#q','#fr','#fc','#fi','#fd'].forEach(s=>$(s).addEventListener('input',render));
load();setInterval(()=>{if(!$('#dlg').open)load()},60000);
</script></body></html>
